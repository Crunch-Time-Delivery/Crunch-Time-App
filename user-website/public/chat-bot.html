<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>DeepAI Chatbot</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Google Sign-In SDK -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #f0f2f5;
}
.top-bar {
  background: #ef0606;
  color: #fff;
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
}
.chat-container {
  max-width: 500px;
  margin: 20px auto;
  background: #fff;
  border-radius: 14px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  display: flex;
  flex-direction: column;
  height: 80vh;
}
.messages {
  flex: 1;
  padding: 15px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
.msg {
  margin-bottom: 12px;
  padding: 10px 14px;
  border-radius: 15px;
  max-width: 80%;
  font-size: 14px;
  position: relative;
  line-height: 1.4;
}
.msg .time {
  font-size: 10px;
  display: block;
  margin-top: 5px;
  opacity: 0.7;
}
.user {
  background: #f20909;
  color: #fff;
  margin-left: auto;
  border-bottom-right-radius: 2px;
}
.bot {
  background: #f1f3f4;
  color: #333;
  margin-right: auto;
  border-bottom-left-radius: 2px;
}
.input-box {
  display: flex;
  padding: 10px;
  border-top: 1px solid #eee;
}
.input-box input {
  flex: 1;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 25px;
  outline: none;
  padding-left: 20px;
}
.input-box button {
  background: #f40404;
  color: #fff;
  border: none;
  padding: 0 20px;
  margin-left: 10px;
  border-radius: 25px;
  cursor: pointer;
}
#signInBtn {
  margin: 10px;
  padding: 10px 20px;
  background: #4285F4;
  color: #fff;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="top-bar" id="topBar">
  <div>AI Chat Bot 🤖</div>
</div>

<!-- Sign-in Modal -->
<div id="signInModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:200;">
  <div id="signInModalContent" style="background:#fff; padding:30px; border-radius:10px; text-align:center; min-width:300px;">
    <div id="modalSignInButton"></div>
    <button style="margin-top:20px; padding:10px 20px; border:none; border-radius:5px; background:#cac3c3; color:#fff; cursor:pointer;" onclick="closeSignInModal()">Close</button>
  </div>
</div>

<div class="chat-container">
  <div style="text-align:center; padding:10px; background:#ddd;">
    <button id="signInBtn">Sign in with Google</button>
    <span id="welcomeMsg" style="display:none;">Welcome, <span id="userName"></span></span>
    <button id="logoutBtn" style="display:none; margin-left:10px;" onclick="logout()">Logout</button>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-box" id="inputContainer" style="display:none;">
    <input id="messageInput" placeholder="Type your message..." onkeypress="handleKeyPress(event)" />
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
const CLIENT_ID = '866867707128-mq963ediu3mijf16r27c8e1fgnmp2h3f';

let currentUser = null; // user info

// Initialize Google Sign-In
function handleGoogleSignIn() {
  google.accounts.id.initialize({
    client_id: CLIENT_ID,
    callback: handleCredentialResponse
  });
  google.accounts.id.renderButton(
    document.getElementById("signInBtn"),
    { theme: "outline", size: "large" }
  );
}
function handleCredentialResponse(response) {
  const payload = parseJwt(response.credential);
  currentUser = {
    name: payload.name,
    avatar: payload.picture
  };
  updateUIAfterLogin();
  addMessage("Logged in! How can I help you today?", "bot");
  closeSignInModal();
}
function parseJwt(token) {
  return JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
}
function updateUIAfterLogin() {
  document.getElementById("topBar").innerHTML = `
    <div style="display:flex;align-items:center;gap:10px">
      <img src="${currentUser.avatar}" style="width:30px;height:30px;border-radius:50%">
      <span>Hi, ${currentUser.name.split(' ')[0]}</span>
    </div>
    <button style="margin-top:10px; padding:10px 20px; border:none; border-radius:5px; background:#f00; color:#fff; cursor:pointer;" onclick="logout()">Logout</button>
  `;
  document.getElementById("inputContainer").style.display = "flex";
  document.getElementById("signInBtn").style.display = "none";
  document.getElementById("welcomeMsg").style.display = "inline";
  document.getElementById("userName").textContent = currentUser.name;
  enableInput();
}
function showSignInModal() {
  document.getElementById('signInModal').style.display = 'flex';
  google.accounts.id.renderButton(
    document.getElementById('modalSignInButton'),
    { theme: "outline", size: "medium" }
  );
}
function closeSignInModal() {
  document.getElementById('signInModal').style.display = 'none';
}
function logout() {
  currentUser = null;
  document.getElementById("topBar").innerHTML = `<div>AI Chat Bot 🤖</div>`;
  disableInput();
  localStorage.removeItem('messageHistory');
  document.getElementById("signInBtn").style.display = "block";
  document.getElementById("welcomeMsg").style.display = "none";
  document.getElementById("logoutBtn").style.display = "none";
}
function enableInput() {
  document.getElementById("messageInput").disabled = false;
  document.getElementById("messageInput").placeholder = "Type a message...";
  document.getElementById("sendBtn").disabled = false;
}
function disableInput() {
  document.getElementById("messageInput").disabled = true;
  document.getElementById("messageInput").placeholder = "Please log in…";
  document.getElementById("sendBtn").disabled = true;
}

// Event listener for sign-in button
document.getElementById("signInBtn").addEventListener("click", handleGoogleSignIn);

// Load chat history
function loadChatHistory() {
  const history = JSON.parse(localStorage.getItem('messageHistory')) || [];
  history.forEach(msg => addMessage(msg.text, msg.type, false));
}
window.onload = () => {
  handleGoogleSignIn();
  loadChatHistory();
  if (!currentUser) disableInput();
};

// Handle key press
function handleKeyPress(e) {
  if (e.key === "Enter") sendMessage();
}

// Send message
async function sendMessage() {
  if (!currentUser) {
    showSignInModal();
    return;
  }
  const inputEl = document.getElementById("messageInput");
  const text = inputEl.value.trim();
  if (!text) return;

  addMessage(text, "user");
  inputEl.value = "";

  const typingId = "typing-" + Date.now();
  addMessage("DeepAI is thinking...", "bot", false, typingId);

  // Call DeepAI API via your backend
  const reply = await getDeepAIResponse(text);
  document.getElementById(typingId).remove();
  addMessage(reply, "bot");
}

// Call your backend proxy for DeepAI
const API_ENDPOINT = 'http://localhost:3000/deepai'; // Replace with your server address

async function getDeepAIResponse(message) {
  try {
    const response = await fetch(API_ENDPOINT, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ message }),
    });

    // Check if response is OK
    if (!response.ok) {
      throw new Error(`Network response was not ok (${response.status})`);
    }

    const data = await response.json();

    // Validate response data
    if (typeof data.reply !== 'string') {
      console.warn('Unexpected response format:', data);
      return 'Sorry, no response.';
    }

    return data.reply;
  } catch (err) {
    console.error('Error calling DeepAI proxy:', err);
    return 'Sorry, there was an error.';
  }
}

// Message display
function addMessage(text, type, save=true, id=null) {
  const msgDiv = document.createElement("div");
  msgDiv.className = `msg ${type}`;
  if (id) msgDiv.id = id;
  const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  msgDiv.innerHTML = `${text} <span class="time">${timeStr}</span>`;
  document.getElementById("messages").appendChild(msgDiv);
  document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;

  if (save) {
    let history = JSON.parse(localStorage.getItem('messageHistory')) || [];
    history.push({ text, type, time: timeStr });
    localStorage.setItem('messageHistory', JSON.stringify(history));
  }
  return msgDiv;
}
</script>

</body>
</html>
