<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>User Login</title>
<style>
  /* Modal styles */
  .modal {
    display: none; 
    position: fixed; 
    z-index: 2000; 
    left: 0;
    top: 0;
    width: 100%; 
    height: 100%; 
    background-color: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-content {
    background-color: #fff;
    padding: 20px;
    border-radius: 8px;
    width: 300px;
    max-width: 90%;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    text-align: center;
  }
  .modal input {
    width: 80%;
    padding: 8px;
    margin-top: 10px;
  }
  .modal button {
    margin-top: 15px;
    padding: 8px 12px;
    cursor: pointer;
  }
  /* Buttons styling for User and Admin */
  #buttonContainer {
    margin-top: 20px;
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .redirectBtn {
    background-color: red;
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
  }
  .redirectBtn:hover {
    opacity: 0.8;
  }
  .notification {
  position: fixed;
  top: 20px;
  right: 20px;
  padding: 15px 25px;
  border-radius: 5px;
  color: #fff;
  font-family: Arial, sans-serif;
  z-index: 1000;
  opacity: 0.9;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

.notification.success {
  background-color: #4CAF50;
}

.notification.error {
  background-color: #f44336;
}
</style>
</head>
<body>

<!-- Login Modal Structure -->
<div id="loginModal" class="modal">
  <div class="modal-content">
    <img src="img/screenshot (251).jpg" alt="Welcome Image" style="width:250px; height:auto; margin-bottom:20px;">
    <h2>Welcome</h2>
    <h3>Login</h3>
    <p>Welcome to CrunchTime halaal food delivery. Login to start ordering.</p>
    <label>Email Address</label>
    <input type="email" id="loginEmail" placeholder="Email" />
    <label>Password</label>
    <input type="password" id="loginPassword" placeholder="Password" />
    <!-- Updated Forgot Password link -->
    <a id="loginForgotPassword" href="http://127.0.0.1:5500/user-website/public/Login/forgotpassword.html" target="_blank">Forgot Password</a>
    
    <button style="margin-top:20px; background-color:red; color:#fff; padding:10px; border:none; border-radius:5px; cursor:pointer; width:100%;" id="loginBtn">Login</button>
    <!-- Buttons for User and Admin -->
    <div id="buttonContainer">
      <button class="redirectBtn" id="userBtn">User</button>
      
    </div>
  </div>
</div>

<!-- OTP Modal -->
<div id="otpModal" class="modal">
  <div class="modal-content">
    <h3>Verify Account</h3>
    <p>Please enter the OTP number sent to your email to reset your password</p>
    <input type="text" id="otpInput" maxlength="4" placeholder="Enter OTP" />
    <div style="margin-top:10px;">
      <button id="verifyOtpBtn">Confirm</button>
      <button id="resendOtpBtn">Resend OTP</button>
    </div>
  </div>
</div>

<script>

 // Function to send SMS via backend API
async function sendSms(toNumber, message) {
  try {
    const response = await fetch('http://localhost:5501/send-sms', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ to: toNumber, message: message })
    });
    const data = await response.json();

    if (data.success) {
      showNotification('SMS sent successfully.', 'success');
    } else {
      showNotification(`Failed to send SMS: ${data.error || 'Unknown error'}`, 'error');
    }
  } catch (error) {
    showNotification(`Error sending SMS: ${error.message}`, 'error');
  }
}

// Helper function to display notifications
function showNotification(message, type) {
  const notification = document.createElement('div');
  notification.innerText = message;
  notification.className = `notification ${type}`; // style based on type

  // Append to body or a specific container
  document.body.appendChild(notification);

  // Remove after 3 seconds
  setTimeout(() => {
    if (notification.parentNode) {
      document.body.removeChild(notification);
    }
  }, 3000);
}

// Check message status
async function checkMessageStatus(messageSid) {
  try {
    const response = await fetch('http://localhost:3001/twilio-message-status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messageSid }),
    });
    return await response.json();
  } catch {
    showNotification('Error fetching message status.', 'error');
    return null;
  }
}

// Fetch message logs
async function fetchMessageLogs(limit = 10) {
  try {
    const response = await fetch(`http://localhost:3001/twilio-message-logs`);
    const data = await response.json();
    return data;
  } catch {
    showNotification('Error fetching message logs.', 'error');
    return [];
  }
}

// Callbacks for different message events
function onSendSuccess(sid) {
  console.log(`Message sent successfully. SID: ${sid}`);
  showNotification(`Message sent! SID: ${sid}`, 'success');
}

function onSendFailure(error) {
  console.error('Failed to send message:', error);
  showNotification(`Failed to send message: ${error}`, 'error');
}

function onStatusUpdate(statusData) {
  console.log('Message status update:', statusData);
  showNotification(`Status: ${statusData.status} for SID: ${statusData.sid}`, 'info');
}

function onError(errorMsg) {
  console.error('Error:', errorMsg);
  showNotification(`Error: ${errorMsg}`, 'error');
}

// Monitor message status periodically
function monitorMessageStatus(sid, intervalMs = 5000) {
  const intervalId = setInterval(async () => {
    const statusData = await checkMessageStatus(sid);
    if (statusData) {
      onStatusUpdate(statusData);
      if (statusData.status === 'delivered' || statusData.status === 'failed') {
        clearInterval(intervalId);
      }
    }
  }, intervalMs);
}

  const driverData = JSON.parse(localStorage.getItem('registeredUser')) || {};
  let driverApproved = false; // Set to true when admin approves
  let generatedOtp = '';

  let userType = null; // 'user' or 'admin'

  // Utility functions
  function showModal(id) { 
    document.getElementById(id).style.display='flex'; // Use flex for centering
  }
  function hideModal(id) { document.getElementById(id).style.display='none'; }

  // OTP functions
  function generateAndSendOtp() {
    generatedOtp = Math.floor(1000 + Math.random() * 9000).toString();
    alert(`OTP sent to Email: ${driverData.email}. (OTP: ${generatedOtp})`);

    // Send OTP via your backend endpoint (which uses Twilio)
  fetch('/send-otp', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      phoneNumber: driverData.contact, // or the phone number you want to send to
      otp: generatedOtp
    })
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      alert(`OTP sent to ${driverData.contact}.`);
    } else {
      alert('Failed to send OTP.');
    }
  })
  .catch(() => {
    alert('Error sending OTP.');
  });

  }
  function showOtp() {
    document.getElementById('otpModal').style.display='flex';
    document.getElementById('otpInput').value='';
  }
  function hideOtp() {
    document.getElementById('otpModal').style.display='none';
  }

  // Fix for User button to redirect to the specified URL
  document.getElementById('userBtn').addEventListener('click', () => {
    window.location.href='http://127.0.0.1:5501/user-website/public/mainpage.html';
  });

  document.getElementById('adminBtn').addEventListener('click', () => {
    userType='admin';
    showModal('loginModal');
  });

  document.getElementById('loginBtn').addEventListener('click', () => {
    const email = document.getElementById('loginEmail').value.trim().toLowerCase();
    const password = document.getElementById('loginPassword').value.trim();

    if (userType === 'user') {
      // Check driver credentials
      if (driverData.email && driverData.email.toLowerCase()===email && driverData.password===password) {
        localStorage.setItem('currentUser', JSON.stringify(driverData));
        if (driverApproved) {
          window.location.href='http://127.0.0.1:5500/user-website/public/mainpage.html';
        } else {
          generateAndSendOtp();
          showOtp();
        }
      } else {
        alert('Invalid driver credentials.');
      }
    } 

    // Reset userType
    userType=null;
  });

  document.getElementById('verifyOtpBtn').addEventListener('click', () => {
    const enteredOtp = document.getElementById('otpInput').value.trim();
    if (enteredOtp===generatedOtp) {
      alert('OTP verified! Please wait for admin approval.');
      hideOtp();
      if (driverApproved) {
        window.location.href='http://127.0.0.1:5500/user-website/public/mainpage.html';
      } else {
        alert('Your account is still pending approval.');
      }
    } else {
      alert('Incorrect OTP.');
    }
  });
  document.getElementById('resendOtpBtn').addEventListener('click', () => {
    generateAndSendOtp();
    alert('OTP resent.');
  });

  // Close modal when clicking outside modal content
  window.onclick = function(event) {
    const loginModal = document.getElementById('loginModal');
    const otpModal = document.getElementById('otpModal');
    if (event.target === loginModal) {
      hideModal('loginModal');
    }
    if (event.target === otpModal) {
      hideModal('otpModal');
    }
  };

  // Show the login modal automatically on page load
  window.onload = function() {
    showModal('loginModal');
  };
</script>
</body>
</html>
