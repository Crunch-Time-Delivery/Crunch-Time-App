AWSTemplateFormatVersion: '2010-09-09'  # Optional, but okay to include
Transform: AWS::Serverless-2016-10-31

Resources:
  SendSmsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      Runtime: nodejs14.x
      InlineCode: |
        const AWS = require('aws-sdk');
        const sns = new AWS.SNS();
        exports.handler = async (event) => {
          const body = JSON.parse(event.body);
          const { phoneNumber, message } = body;
          if (!phoneNumber || !message) {
            return { statusCode: 400, body: JSON.stringify({ success: false, error: 'Missing parameters' }) };
          }
          try {
            await sns.publish({ PhoneNumber: phoneNumber, Message: message }).promise();
            return { statusCode: 200, body: JSON.stringify({ success: true }) };
          } catch (err) {
            return { statusCode: 500, body: JSON.stringify({ success: false, error: err.message }) };
          }
        }
      Policies:
        - SNS::Publish
      Timeout: 10

  SendSmsApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: SendSmsApi
      StageName: prod
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
