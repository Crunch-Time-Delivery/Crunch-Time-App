<!-- capture_location.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Capture Location</title>
</head>
<body>
<div id="root"></div>

<!-- React and Babel scripts -->
<script src="https://cdn.jsdelivr.net/npm/react/umd/react.development.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom/umd/react-dom.development.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/babel-standalone/babel.min.js"></script>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/supabase.min.js"></script>

<!-- Your React component -->
<script type="text/babel" src="capture_location.jsx"></script>

<!-- Load Google Maps with callback -->
<script type="text/babel">
  // Initialize Google Maps after it loads
function initMap() {
  if (window.CaptureLocationRef && typeof window.CaptureLocationRef.initMap === 'function') {
    window.CaptureLocationRef.initMap();
  } else {
    console.warn('CaptureLocationRef or initMap method not available.');
  }
}

// Load Google Maps script dynamically
(function loadGoogleMaps() {
  if (typeof google !== 'undefined' && typeof google.maps !== 'undefined') {
    // Already loaded
    initMap();
    return;
  }

  // Assign initMap globally for callback
  window.initMap = initMap;

  const script = document.createElement('script');
  script.src = `https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap`;
  script.async = true;
  script.defer = true;

  script.onerror = () => alert('Failed to load Google Maps. Please check your API key and network connection.');

  document.head.appendChild(script);
})();

// Render React component and assign ref globally
ReactDOM.render(
  <CaptureLocation ref={(ref) => { window.CaptureLocationRef = ref; }} />,
  document.getElementById('root')
);
</script>

<!-- Navigation link -->
<div style="margin-top:20px; text-align:center;">
  <a href="../user-app/search_location.html" style="font-size:16px; color:blue; text-decoration:underline;">Go to Search Location</a>
</div>

</body>
</html>
