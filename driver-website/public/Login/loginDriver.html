
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Driver Login</title>
<style>
  /* Modal styles */
  .modal {
    display: none; 
    position: fixed; 
    z-index: 2000; 
    left: 0;
    top: 0;
    width: 100%; 
    height: 100%; 
    overflow: auto; 
    background-color: rgba(0,0,0,0.4);
  }
  .modal-content {
    background-color: #fff;
    margin: 15% auto; 
    padding: 20px;
    border-radius: 8px;
    width: 300px;
    text-align: center;
  }
  .modal input {
    width: 80%;
    padding: 8px;
    margin-top: 10px;
  }
  .modal button {
    margin-top: 15px;
    padding: 8px 12px;
    cursor: pointer;
  }
  #buttonContainer {
    margin-top: 20px;
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .redirectBtn {
    background-color: red;
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
  }
  .redirectBtn:hover {
    opacity: 0.8;
  }
  #loginForgotPassword {
    display: block;
    text-align: center;
    margin: 10px auto;
    cursor: pointer;
    color: blue;
    text-decoration: underline;
    font-size: 14px;
  }
</style>
</head>
<body>

<div id="innerContent"></div>

<!-- Login Modal -->
<div id="loginModal" class="modal">
  <div class="modal-content">
    <img src="img/screenshot (251).jpg" alt="Welcome Image" style="width:250px; height:auto; margin-bottom:20px;">
    <h2>Welcome</h2>
    <h3>Login</h3>
    <p>Welcome to CrunchTime halaal food delivery. Login to start ordering.</p>
    <label>Email Address</label>
    <input type="email" id="loginEmail" placeholder="Email" />
    <label>Password</label>
    <input type="password" id="loginPassword" placeholder="Password" />
    <a id="loginForgotPassword" href="http://127.0.0.1:5501/driver-website/public/Login/forgotpassword.html" target="_blank">Forgot Password</a>
    <button style="margin-top:20px; background-color:red; color:#fff; padding:10px; border:none; border-radius:5px; cursor:pointer; width:100%;" id="loginBtn">Login</button>
    <div id="buttonContainer">
      <button class="redirectBtn" id="driverBtn">Driver</button>
    </div>
  </div>
</div>

<!-- OTP Modal -->
<div id="otpModal" class="modal">
  <div class="modal-content">
    <h3>Verify Account</h3>
    <p>Please enter the OTP number sent to your email to reset your password</p>
    <input type="text" id="otpInput" maxlength="4" placeholder="Enter OTP" />
    <div style="margin-top:10px;">
      <button id="verifyOtpBtn">Confirm</button>
      <button id="resendOtpBtn">Resend OTP</button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/supabase.min.js"></script>
<script>
  // Initialize Supabase
  const supabaseUrl = 'https://wbpgmgtoyzlnawvsfeiu.supabase.co';
  const supabaseKey =process.env.SUPABASE_KEY; // Replace with your actual key
  const supabase = supabase.createClient(supabaseUrl, supabaseKey);

  // Notification function
  function showNotification(message, type) {
    const notification = document.createElement('div');
    notification.innerText = message;
    notification.className = `notification ${type}`;
    document.body.appendChild(notification);
    setTimeout(() => {
      document.body.removeChild(notification);
    }, 3000);
  }

  // Function to login driver via Supabase
  async function loginDriver(email, password) {
    const { data, error } = await supabase
      .from('Drivers')
      .select('*')
      .eq('email', email)
      .single();

    if (error || !data) {
      showNotification('Driver not found.', 'error');
      return;
    }

    if (data.password === password) {
      localStorage.setItem('currentUser', JSON.stringify(data));
      if (data.approved) {
        window.location.href = 'http://127.0.0.1:5501/driver-website/public/mainpage.html';
      } else {
        generateAndSendOtp();
        showOtpModal();
      }
    } else {
      showNotification('Incorrect password.', 'error');
    }
  }

  // Login button event
document.getElementById('loginBtn')?.addEventListener('click', () => {
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const password = document.getElementById('loginPassword').value.trim();
  // Set userType elsewhere, e.g., radio buttons
  if (userType === 'driver') {
    loginDriver(email, password);
  }
});

// OTP functions
let generatedOtp = '';
let otpVerified = false;

function generateAndSendOtp() {
  generatedOtp = Math.floor(1000 + Math.random() * 9000).toString();
  alert(`OTP sent to Email: ${driverData.email}. (OTP: ${generatedOtp})`);
  fetch('/send-otp', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phoneNumber: driverData.contact, otp: generatedOtp })
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      alert(`OTP sent to ${driverData.contact}.`);
    } else {
      alert('Failed to send OTP.');
    }
  })
  .catch(() => {
    alert('Error sending OTP.');
  });
}

function showOtpModal() {
  document.getElementById('otpModal').style.display='block';
  document.getElementById('otpInput').value='';
  otpVerified=false;
}

document.getElementById('verifyOtpBtn')?.addEventListener('click', () => {
  const enteredOtp = document.getElementById('otpInput').value.trim();
  if (enteredOtp===generatedOtp) {
    otpVerified=true;
    alert('OTP verified! Awaiting admin approval...');
    hideOtpModal();
    if (driverData.approved) {
      alert('Login successful! Accessing driver dashboard...');
      window.location.href='http://127.0.0.1:5501/driver-website/public/mainpage.html';
    } else {
      alert('Waiting for admin approval.');
    }
  } else {
    alert('Incorrect OTP.');
  }
});

document.getElementById('resendOtpBtn')?.addEventListener('click', () => {
  generateAndSendOtp();
  alert('OTP resent.');
});

function hideOtpModal() {
  document.getElementById('otpModal').style.display='none';
}

// SMS sending via backend API
function sendSms(toNumber, message) {
  fetch('http://localhost:3000/send-sms', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ to: toNumber, message: message })
  })
  .then(response => response.json())
  .then(data => {
    if(data.success) {
      showNotification('SMS sent successfully.', 'success');
    } else {
      showNotification('Failed to send SMS: ' + data.error, 'error');
    }
  })
  .catch(() => {
    showNotification('Error sending SMS.', 'error');
  });
}

// Message status check
function checkMessageStatus(messageSid, callback) {
  fetch('http://localhost:3001/twilio-message-status', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messageSid }),
  })
  .then(res => res.json())
  .then(data => {
    if (callback) callback(data);
  })
  .catch(() => {
    showNotification('Error fetching message status.', 'error');
  });
}

// Message logs
function fetchMessageLogs(limit=10, callback) {
  fetch(`http://localhost:3001/twilio-message-logs`)
    .then(res => res.json())
    .then(data => {
      if (callback) callback(data);
    })
    .catch(() => {
      showNotification('Error fetching message logs.', 'error');
    });
}

// Message status handlers
function onSendSuccess(sid) {
  console.log(`Message sent successfully. SID: ${sid}`);
  showNotification(`Message sent! SID: ${sid}`, 'success');
}

function onSendFailure(error) {
  console.error('Failed to send message:', error);
  showNotification(`Failed to send message: ${error}`, 'error');
}

function onStatusUpdate(statusData) {
  console.log('Message status update:', statusData);
  showNotification(`Status: ${statusData.status} for SID: ${statusData.sid}`, 'info');
}

function monitorMessageStatus(sid) {
  const intervalId = setInterval(() => {
    checkMessageStatus(sid, (statusData) => {
      onStatusUpdate(statusData);
      if (statusData.status === 'delivered' || statusData.status === 'failed') {
        clearInterval(intervalId);
      }
    });
  }, 5000);
}

// Load driver data (from localStorage or elsewhere)
const driverData = JSON.parse(localStorage.getItem('registeredUser')) || {};
let driverApproved = false; // update accordingly

  })
  .then(res => res.json())
  .then(data => { if(data.success){ alert(`OTP sent to ${driverData.contact}.`);} else { alert('Failed to send OTP.'); }})
  .catch(() => { alert('Error sending OTP.'); });
}

document.getElementById('verifyOtpBtn')?.addEventListener('click', () => {
  const enteredOtp = document.getElementById('otpInput').value.trim();
  if (enteredOtp===generatedOtp) {
    otpVerified=true;
    alert('OTP verified! Awaiting admin approval...');

    if (driverData.approved) {
      alert('Login successful! Accessing driver dashboard...');
      window.location.href='http://127.0.0.1:5501/driver-website/public/mainpage.html';
    } else {
      alert('Waiting for admin approval.');
    }
  } else {
    alert('Incorrect OTP.');
  }
});

document.getElementById('resendOtpBtn')?.addEventListener('click', () => {
  generateAndSendOtp();
  alert('OTP resent.');
});
