name: CI

on:
  push:
    branches:
      - main  # or your branch
  pull_request:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'  # Force Node.js 24

      - name: List current dependencies and devDependencies
        run: |
          echo "Dependencies:"
          jq -r '.dependencies | to_entries[] | "\(.key): \(.value)"' package.json || echo "No dependencies"
          echo "DevDependencies:"
          jq -r '.devDependencies | to_entries[] | "\(.key): \(.value)"' package.json || echo "No devDependencies"

      # Optional: run validation (comment out if needed)
      - name: Validate package.json dependencies
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));const deps={...p.dependencies,...p.devDependencies};for(const [n,v] of Object.entries(deps)){if(n.startsWith('-')){console.error(\`Invalid package name: '\${n}'. Package names cannot start with a hyphen.\`);process.exit(1);}}console.log('All package names are valid.');"

      - name: Install dependencies
        run: npm install

      - name: List npm scripts for debugging
        run: npm run

      - name: Build project
        run: npm run build