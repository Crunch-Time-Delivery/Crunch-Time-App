name: CI

on:
  push:
    branches:
      - main  # or your branch
  pull_request:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'  # Force Node.js 24

      - name: List current dependencies and devDependencies
        run: |
          echo "Dependencies:"
          jq -r '.dependencies | to_entries[] | "\(.key): \(.value)"' package.json || echo "No dependencies"
          echo "DevDependencies:"
          jq -r '.devDependencies | to_entries[] | "\(.key): \(.value)"' package.json || echo "No devDependencies"

      - name: Validate package.json dependencies for invalid package names
        run: |
          node -e "
            const fs = require('fs');
            const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const allDeps = {...(packageJson.dependencies || {}), ...(packageJson.devDependencies || {})};
            let invalidNames = [];
            for (const name of Object.keys(allDeps)) {
              if (name.startsWith('-')) {
                invalidNames.push(name);
              }
            }
            if (invalidNames.length > 0) {
              console.error('Invalid package names found:', invalidNames.join(', '));
              process.exit(1);
            } else {
              console.log('All package names are valid.');
            }
          "

      - name: Install dependencies
        run: npm install

      - name: List npm scripts for debugging
        run: npm run

      - name: Build project
        run: npm run build