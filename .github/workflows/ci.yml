name: CI

on:
  push:
    branches:
      - main  # or your branch name
  pull_request:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3  # Updated to v3 for compatibility

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'  # Force Node.js 24

      - name: Install dependencies
        run: npm install

      - name: List npm scripts for debugging
        run: npm run

      - name: Build project
        run: npm run build